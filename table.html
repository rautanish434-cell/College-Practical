<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Table creating in html</title>
</head>

<body>

    <table border="1" width="400" height="600" bgcolor="red" bordercolor="green">

       
        <tr>
            <th colspan="2">Name</th>
            <th>Age</th>
            <th>Grade</th>
        </tr>

        <tr>
            <td rowspan="2">Anish</td>
            <td>18</td>
            <td>ten</td>
        </tr>

        <tr>
            <td>Suraj</td>
            <td>29</td>
            <td>nine</td>

        </tr>

        <tr>
            <td>ram</td>
            <td>38</td>
            <td>seven</td>
        </tr>
        <tr>
            <td>priyanka</td>
            <td>18</td>
            <td>eleven</td>
        </tr>

        <caption align="left">Paratice of Table</caption>


    </table>

     
   

</body>
</html>
